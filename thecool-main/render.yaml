services:
  - type: web
    name: neuralflow-v7
    runtime: node
    plan: starter
    rootDir: thecool-main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    env: node
    branch: v8
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MOSS_INDEX_NAME
        value: neuralflow-kb
      - key: MOSS_EMBEDDINGS
        value: local
      # Set these in Render Dashboard → Environment (not committed):
      # MOSS_PROJECT_ID
      # MOSS_PROJECT_KEY
      # LIVEKIT_URL
      # LIVEKIT_API_KEY
      # LIVEKIT_API_SECRET
      # LLM_API_KEY
      # LLM_BASE_URL
      # LLM_MODEL
